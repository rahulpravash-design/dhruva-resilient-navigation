# Fixed trajectory splits. Never tune on `test`. Split is by trajectory (drive), never by window/row.
# SYNTHETIC drives are generated by dhruva.speednet.data.random_scenario(seed).
synthetic:
  train: {seed_start: 1000, count: 150}
  val:   {seed_start: 2000, count: 30}     # used for all tuning
  dev:   {seed_start: 3000, count: 40}     # was `test` in the first P4 eval; failures were inspected while debugging, so it is contaminated
  test:  {seed_start: 4000, count: 40}     # untouched until final reporting
# Real-data splits are added here when data/raw/ is populated (GSDC / own drives); none exist yet.
real: {}
